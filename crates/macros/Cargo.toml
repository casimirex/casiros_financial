[package]
name = "casiros-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

# casiros-erp is a dev-dependency only: the macro's expansion references
# casiros_erp::narrative::* by fully-qualified path, but that reference is
# resolved in the *caller's* crate context, not this one. It's needed here
# only so the doctest on generate_narrative! (which invokes the macro) has
# something to link against.
[dev-dependencies]
casiros-erp = { path = "../erp" }
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
