[package]
name = "casiros-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# actix-ws (not the spec-named actix-web-actors) provides the WebSocket
# streaming endpoint: actix-web-actors is published as "4.3.1+deprecated" on
# crates.io. The spec itself offers "actix-web-actors or raw WebSocket
# handlers" as alternatives; actix-ws is exactly the modern raw-handler,
# non-actor approach.
#
# No database/persistence crate: the ERP routes hold state in-memory
# (AppState, Mutex-guarded), matching the original build prompt's Cargo.toml
# for this crate, which lists none either. Swapping in real persistence is a
# later concern, not part of this pass.
[dependencies]
actix-cors = "0.7"
actix-web = "4"
actix-ws = "0.4"
casiros-core = { path = "../core" }
casiros-dag = { path = "../dag" }
casiros-erp = { path = "../erp" }
casiros-simulator = { path = "../simulator" }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
rust_decimal = { workspace = true, features = ["serde-with-str"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["actix_extras", "decimal", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
rust_decimal_macros.workspace = true
