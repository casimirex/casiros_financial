[package]
name = "casiros-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# actix-ws (not the spec-named actix-web-actors) provides the WebSocket
# streaming endpoint: actix-web-actors is published as "4.3.1+deprecated" on
# crates.io. The spec itself offers "actix-web-actors or raw WebSocket
# handlers" as alternatives; actix-ws is exactly the modern raw-handler,
# non-actor approach.
#
# Persistence (Phase 9): sqlx over sea-orm, matching this workspace's
# explicit-over-implicit style (hand-rolled checked_* arithmetic everywhere,
# no ORM elsewhere either). Queries are runtime-checked (`query_as`), not the
# compile-time `query!` macro, so `cargo build` stays fully DB-independent —
# a real Postgres is only needed at runtime and in the persistence module's
# own tests (which use testcontainers, see dev-dependencies). casiros-erp
# itself gets no sqlx dependency: Dollar/Rate/Ratio are plain
# rust_decimal::Decimal type aliases, which sqlx's "rust_decimal" feature
# already knows how to encode/decode, and every other erp type crosses the
# persistence boundary via manual conversion in `persistence/`, not a derive
# on the domain type itself.
[dependencies]
actix-cors = "0.7"
actix-web = "4"
actix-ws = "0.4"
casiros-core = { path = "../core" }
casiros-dag = { path = "../dag" }
casiros-erp = { path = "../erp" }
casiros-simulator = { path = "../simulator" }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
rust_decimal = { workspace = true, features = ["serde-with-str"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "rust_decimal", "migrate"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["actix_extras", "decimal", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
actix-test = "0.1.5"
awc = "3.8.2"
rust_decimal_macros.workspace = true
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "redis"] }
