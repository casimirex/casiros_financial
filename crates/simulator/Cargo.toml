[package]
name = "casiros-simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# casiros-dag is deliberately NOT a dependency here: its HashMap/string-keyed
# node evaluation is the right tool for one-off ERP-style formula composition,
# but wrong for a hot Monte Carlo loop run thousands of times per simulation.
# compute_universe_metrics calls casiros_core functions directly instead.
[dependencies]
casiros-core = { path = "../core" }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
rust_decimal = { workspace = true, features = ["serde-with-str"] }
rust_decimal_macros.workspace = true
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
proptest = "1.5"
