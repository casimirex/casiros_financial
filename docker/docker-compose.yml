# Phase 9: db and redis are real dependencies now — casiros-api persists
# ledger/AP/AR/treasury state to Postgres and uses Redis for rate limiting
# and simulation-result caching (see crates/api/src/persistence/ and
# crates/api/src/middleware/redis_rate_limit.rs).
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      CASIROS_SERVER__BIND_ADDR: "0.0.0.0:8080"
      DATABASE_URL: "postgres://casiros:casiros@db/casiros"
      REDIS_URL: "redis://redis/"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: casiros
      POSTGRES_PASSWORD: casiros
      POSTGRES_DB: casiros
    volumes:
      - casiros-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casiros"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  casiros-db-data:
