# db and redis are scaffolded per the build spec's target architecture, but
# the running app doesn't connect to either yet — casiros-api is currently
# fully in-memory (see crates/api/src/state.rs and casiros-erp's Cargo.toml
# comment on why no persistence crate is wired in). Wiring real persistence
# is a later increment, not part of this pass.
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      CASIROS_SERVER__BIND_ADDR: "0.0.0.0:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: casiros
      POSTGRES_PASSWORD: casiros
      POSTGRES_DB: casiros
    volumes:
      - casiros-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casiros"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  casiros-db-data:
