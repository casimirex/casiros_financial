[graph]
targets = []

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path dependencies (casiros-core, casiros-dag, ...) have no
# version requirement by design; without this they're indistinguishable from
# a real "*" wildcard dependency on crates.io and get flagged.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
